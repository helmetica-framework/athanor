apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental v1alpha2 changes"
    controller-gen.kubebuilder.io/version: "v0.20.1"
    objectstorage.k8s.io/authors: "Kubernetes Authors"
    objectstorage.k8s.io/license: "Apache V2"
    objectstorage.k8s.io/support: "https://github.com/kubernetes-sigs/container-object-storage-api"
  name: "bucketclaims.objectstorage.k8s.io"
spec:
  group: "objectstorage.k8s.io"
  names:
    kind: "BucketClaim"
    listKind: "BucketClaimList"
    plural: "bucketclaims"
    singular: "bucketclaim"
  scope: "Namespaced"
  versions:
  - additionalPrinterColumns:
    - jsonPath: ".status.readyToUse"
      name: "Ready"
      type: "boolean"
    - jsonPath: ".status.boundBucketName"
      name: "Bucket"
      type: "string"
    - jsonPath: ".spec.bucketClassName"
      name: "Class"
      type: "string"
    - jsonPath: ".status.error.message"
      name: "Error"
      priority: 1
      type: "string"
    - jsonPath: ".metadata.creationTimestamp"
      name: "Age"
      type: "date"
    name: "v1alpha2"
    schema:
      openAPIV3Schema:
        description: "BucketClaim is the Schema for the bucketclaims API"
        properties:
          apiVersion:
            description: "APIVersion defines the versioned schema of this representation of an object.\nServers should convert recognized schemas to the latest internal value, and\nmay reject unrecognized values.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources"
            type: "string"
          kind:
            description: "Kind is a string value representing the REST resource this object represents.\nServers may infer this from the endpoint the client submits requests to.\nCannot be updated.\nIn CamelCase.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds"
            type: "string"
          metadata:
            type: "object"
          spec:
            description: "spec defines the desired state of BucketClaim"
            minProperties: 1
            properties:
              bucketClassName:
                description: "bucketClassName selects the BucketClass for provisioning the BucketClaim.\nThis field is used only for BucketClaim dynamic provisioning.\nIf unspecified, existingBucketName must be specified for binding to an existing Bucket.\nMust be a valid Kubernetes resource name: at most 253 characters, consisting only of\nlower-case alphanumeric characters, hyphens, and periods, starting and ending with an\nalphanumeric character."
                maxLength: 253
                minLength: 1
                type: "string"
                x-kubernetes-validations:
                - message: "name must be a valid resource name"
                  rule: "!format.dns1123Subdomain().validate(self).hasValue()"
                - message: "bucketClassName is immutable"
                  rule: "self == oldSelf"
              existingBucketName:
                description: "existingBucketName selects the name of an existing Bucket resource that this BucketClaim\nshould bind to.\nThis field is used only for BucketClaim static provisioning.\nIf unspecified, bucketClassName must be specified for dynamically provisioning a new bucket.\nMust be a valid Kubernetes resource name: at most 253 characters, consisting only of\nlower-case alphanumeric characters, hyphens, and periods, starting and ending with an\nalphanumeric character."
                maxLength: 253
                minLength: 1
                type: "string"
                x-kubernetes-validations:
                - message: "name must be a valid resource name"
                  rule: "!format.dns1123Subdomain().validate(self).hasValue()"
                - message: "existingBucketName is immutable"
                  rule: "self == oldSelf"
              protocols:
                description: "protocols lists object storage protocols that the provisioned Bucket must support.\nIf specified, COSI will verify that each item is advertised as supported by the driver.\nIt is recommended to specify all protocols that applications will rely on in BucketAccesses\nreferencing this BucketClaim.\nPossible values: 'S3', 'Azure', 'GCS'."
                items:
                  description: "ObjectProtocol represents an object protocol type."
                  enum:
                  - "S3"
                  - "Azure"
                  - "GCS"
                  type: "string"
                maxItems: 3
                minItems: 1
                type: "array"
                x-kubernetes-list-type: "set"
                x-kubernetes-validations:
                - message: "protocols list is immutable"
                  rule: "self == oldSelf"
            type: "object"
            x-kubernetes-validations:
            - message: "bucketClassName cannot be added or removed after creation"
              rule: "has(oldSelf.bucketClassName) == has(self.bucketClassName)"
            - message: "existingBucketName cannot be added or removed after creation"
              rule: "has(oldSelf.existingBucketName) == has(self.existingBucketName)"
            - message: "protocols list cannot be added or removed after creation"
              rule: "has(oldSelf.protocols) == has(self.protocols)"
            - message: "exactly one of the fields in [bucketClassName existingBucketName] must be set"
              rule: "[has(self.bucketClassName),has(self.existingBucketName)].filter(x,x==true).size() == 1"
          status:
            description: "status defines the observed state of BucketClaim"
            properties:
              boundBucketName:
                description: "boundBucketName is the name of the Bucket this BucketClaim is bound to.\nMust be a valid Kubernetes resource name: at most 253 characters, consisting only of\nlower-case alphanumeric characters, hyphens, and periods, starting and ending with an\nalphanumeric character."
                maxLength: 253
                minLength: 1
                type: "string"
                x-kubernetes-validations:
                - message: "name must be a valid resource name"
                  rule: "!format.dns1123Subdomain().validate(self).hasValue()"
                - message: "boundBucketName is immutable once set"
                  rule: "self == oldSelf"
              error:
                description: "error holds the most recent error message, with a timestamp.\nThis is cleared when provisioning is successful."
                minProperties: 0
                properties:
                  message:
                    description: "message is a string detailing the encountered error.\nNOTE: message will be logged, and it should not contain sensitive information.\nMust not exceed 1.5MB."
                    maxLength: 1572864
                    minLength: 0
                    type: "string"
                  time:
                    description: "time is the timestamp when the error was encountered."
                    format: "date-time"
                    type: "string"
                type: "object"
              protocols:
                description: "protocols is the set of protocols the bound Bucket reports to support. BucketAccesses can\nrequest access to this BucketClaim using any of the protocols reported here.\nPossible values: 'S3', 'Azure', 'GCS'."
                items:
                  description: "ObjectProtocol represents an object protocol type."
                  enum:
                  - "S3"
                  - "Azure"
                  - "GCS"
                  type: "string"
                maxItems: 3
                minItems: 1
                type: "array"
                x-kubernetes-list-type: "set"
              readyToUse:
                description: "readyToUse indicates that the bucket is ready for consumption by workloads."
                type: "boolean"
            required:
            - "readyToUse"
            type: "object"
            x-kubernetes-validations:
            - message: "boundBucketName cannot be removed once set"
              rule: "!has(oldSelf.boundBucketName) || has(self.boundBucketName)"
            - message: "protocols cannot be removed once set"
              rule: "!has(oldSelf.protocols) || has(self.protocols)"
        required:
        - "spec"
        type: "object"
    served: true
    storage: true
    subresources:
      status: {}
