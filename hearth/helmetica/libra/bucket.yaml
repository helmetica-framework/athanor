apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClaim
metadata:
  name: libra-billing
spec:
  bucketClassName: garage
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccess
metadata:
  name: libra-billing
spec:
  bucketAccessClassName: garage
  protocol: S3
  bucketClaims:
    - bucketClaimName: libra-billing
      accessMode: ReadWrite
      accessSecretName: libra-billing
