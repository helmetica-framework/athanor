apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - adept
  - chrysopoeia
  # Harnessed operators reach the API server through this proxy, not directly: without it
  # their pods are pointed at a Service that does not exist and never start.
  - chrysopoeia-proxy
  - chrysopoeia-flux
  - sigillum
  - ampulla
  # Binds to a ClusterRole chrysopoeia owns and borrows its instance-admin
  # ServiceAccount to run gather Jobs, so it only works alongside it.
  - custos
