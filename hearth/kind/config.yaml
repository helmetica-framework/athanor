kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  "ImageVolume": true
networking:
  apiServerPort: 36377
# Make the internal registry usable via `localhost:5000`
# Does not work for provider-helm though!
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://registry.kube-system.svc.cluster.local:5000"]
nodes:
  - role: control-plane
    # The istio-ingressgateway node ports, hearth/istio/ingressgateway.yaml.
    extraPortMappings:
      - containerPort: 31080
        hostPort: 8088
        protocol: TCP
      - containerPort: 31443
        hostPort: 8443
        protocol: TCP
      - containerPort: 5000
        hostPort: 5000
        protocol: TCP
  - role: worker
  # - role: worker
  # - role: worker
