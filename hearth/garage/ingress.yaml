# Reaches the Garage S3 API from the host, through traefik on localhost:8088.
#
# Nothing in the cluster needs this: ampulla and the COSI driver talk to svc/garage
# directly. It is here so an `aws s3` or `mc` on the laptop can look at what the backup
# path actually wrote.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-s3
  namespace: garage-system
spec:
  # No ingressClassName: traefik is the default class (hearth/traefik/values.yaml).
  rules:
    # nip.io resolves this to 127.0.0.1, the same trick the prometheus URLs use.
    - host: s3.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                # s3 only. 3903 is the admin API, which is full control of the cluster
                # behind one bearer token, and has no business on an ingress.
                port:
                  number: 3900
