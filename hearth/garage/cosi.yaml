# The classes a BucketClaim asks for. Point a driver's consumers at `garage` and their
# buckets are provisioned in the local Garage cluster.
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClass
metadata:
  name: garage
spec:
  driverName: garage.rajsingh.info
  # Retain: Garage never deletes data, and its driver refuses to delete a bucket that still
  # holds objects. With Delete, removing the claim of a bucket that holds a backup blocks on
  # the driver forever, and so does the instance namespace around it. The Bucket and its
  # data outlive the claim instead.
  deletionPolicy: Retain
  parameters:
    clusterRef: garage
    clusterNamespace: garage-system
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccessClass
metadata:
  name: garage
spec:
  driverName: garage.rajsingh.info
  # Key is the only type Garage supports: it has no IAM.
  authenticationType: Key
  parameters:
    clusterRef: garage
    clusterNamespace: garage-system
