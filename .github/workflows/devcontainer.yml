name: Devcontainer

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  workflow_dispatch:

env:
  # renovate: datasource=npm depName=@devcontainers/cli
  DEVCONTAINER_CLI_VERSION: '0.89.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install devcontainer CLI
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Build devcontainer
        run: devcontainer build --workspace-folder .

      # postCreateCommand is skipped: it spins up the kind cluster, which is
      # already covered by the Ignite workflow.
      - name: Start devcontainer
        run: devcontainer up --workspace-folder . --skip-post-create

      - name: Smoke test tooling
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            set -euo pipefail
            go version
            just --version
            kubectl version --client
            kubecolor --kubecolor-version
            helm version
            jq --version
            yq --version
            kubectl krew version
            transmuter --help >/dev/null
            docker version
          '
